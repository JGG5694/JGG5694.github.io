name: Sync Roblox avatar

on:
  schedule:
    - cron: '17 */6 * * *'   # toutes les 6h
  workflow_dispatch:          # bouton "Run workflow" pour forcer une synchro

permissions:
  contents: write

concurrency:
  group: avatar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch avatar from Roblox
        run: node scripts/fetch-avatar.mjs
        env:
          ROBLOX_USER_ID: '1077832330'
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avatar
          if git diff --cached --quiet; then
            echo "Avatar inchangé."
            exit 0
          fi
          git commit -m "chore: sync Roblox avatar"
          git push
