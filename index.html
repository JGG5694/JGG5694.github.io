  <style>
    :root {
      --s: 1.5;   /* échelle globale du site (1 = taille d'origine) */
      --bg: #f4f5f7;
      --text: #1f2125;
      --dim: #62666e;
      --faint: #8d929a;
      --surface: #e7e9ed;
      --online: #2f9e44;
      --idle: #b7860b;
      --dnd: #d14343;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: calc(13px * var(--s))/1.6 'JetBrains Mono', ui-monospace, Consolas, monospace;
      min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: calc(1px * var(--s)) solid var(--text); outline-offset: calc(3px * var(--s)); }
    ::selection { background: #cfe3ff; }

    body { display: flex; flex-direction: column; }
    main { width: 100%; max-width: calc(1000px * var(--s)); margin: 0 auto; padding: calc(3rem * var(--s)) calc(1.5rem * var(--s)); flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* ── TOP : avatar 3D + profil ── */
    .top { display: grid; grid-template-columns: calc(340px * var(--s)) 1fr; gap: calc(2.5rem * var(--s)); align-items: center; }
    .stage { position: relative; height: calc(400px * var(--s)); cursor: grab; }
    .stage canvas { z-index: 1; position: absolute; top: -110px; bottom: -110px; left: -40px; right: -40px; width: calc(100% + calc(80px * var(--s))) !important; height: calc(100% + calc(220px * var(--s))) !important; pointer-events: none; }
    .stage img.avatar-2d { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; }
    .stage-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); }

    .profile { display: flex; align-items: center; gap: calc(1.6rem * var(--s)); }
    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .pfp-wrap { --ring: var(--faint); position: relative; flex: none; width: calc(120px * var(--s)); height: calc(120px * var(--s)); }
    .pfp-wrap::before, .pfp-wrap::after { content: ''; position: absolute; inset: -5px; border-radius: calc(13px * var(--s)); padding: calc(3px * var(--s)); pointer-events: none;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    .pfp-wrap::after { background: var(--ring); opacity: 0.22; }
    .pfp-wrap::before { background: conic-gradient(from var(--angle), transparent 0 45%, var(--ring) 78%, transparent 100%); animation: ring 9s linear infinite; z-index: 1; }
    .pfp { display: block; width: 100%; height: 100%; border-radius: calc(8px * var(--s)); background: var(--surface); object-fit: cover; }
    .pfp-deco { position: absolute; inset: -12%; width: 124%; height: 124%; pointer-events: none; z-index: 2; }
    .hi { font-size: calc(22px * var(--s)); font-weight: 600; letter-spacing: -0.01em; }
    .hi .name { display: inline-block; }
    .hi .name span { display: inline-block; transform-origin: 50% 100%; }
    .hi .name.jump span { animation: hop 0.85s cubic-bezier(.45,0,.25,1) both; }
    .hi .name.jump span:nth-child(2) { animation-delay: 0.1s; }
    .hi .name.jump span:nth-child(3) { animation-delay: 0.2s; }
    .sub { color: var(--dim); margin-top: calc(0.2rem * var(--s)); min-height: 1.6em; }
    .caret { display: inline-block; width: 0.55em; height: 1.05em; margin-left: calc(2px * var(--s)); vertical-align: -0.18em; background: var(--dim); animation: blink 1s steps(1) infinite; }
    .socials { display: flex; gap: calc(0.9rem * var(--s)); margin-top: calc(0.8rem * var(--s)); }
    .socials a, .socials button { color: var(--dim); display: flex; transition: color 0.15s; position: relative; }
    .socials a:hover, .socials button:hover { color: var(--text); }
    .socials svg { width: calc(17px * var(--s)); height: calc(17px * var(--s)); }
    .tip { position: absolute; left: 50%; top: -1.9rem; transform: translateX(-50%); white-space: nowrap; font-size: calc(11px * var(--s)); color: var(--text); background: var(--text); color: var(--bg); padding: calc(0.15rem * var(--s)) calc(0.45rem * var(--s)); border-radius: calc(3px * var(--s)); pointer-events: none; }

    .presence { margin: calc(2rem * var(--s)) 0 0 calc(calc(120px * var(--s)) + calc(1.6rem * var(--s))); display: flex; flex-direction: column; gap: calc(0.35rem * var(--s)); color: var(--faint); }
    .row { display: flex; align-items: center; gap: calc(0.8rem * var(--s)); }
    .row[hidden] { display: none; }
    .row svg { width: calc(14px * var(--s)); height: calc(14px * var(--s)); flex: none; color: var(--dim); }
    .row .st { font-weight: 600; display: inline-flex; align-items: center; gap: calc(0.45rem * var(--s)); }
    .row .st .dot { width: calc(7px * var(--s)); height: calc(7px * var(--s)); border-radius: 50%; background: currentColor; animation: pulse 2s ease-out infinite; }
    .row .st.offline .dot { animation: none; }
    .row .st.online { color: var(--online); }
    .row .st.idle { color: var(--idle); }
    .row .st.dnd { color: var(--dnd); }
    .row .st.offline { color: var(--dim); }
    .row .act { color: var(--dim); }

    /* ── WHAT I'M WORKING ON ── */
    .wip { position: relative; margin: calc(1.6rem * var(--s)) 0 0 calc(calc(120px * var(--s)) + calc(1.6rem * var(--s))); }
    .wip-toggle { display: inline-flex; align-items: center; gap: calc(0.5rem * var(--s)); color: var(--dim); padding: calc(0.2rem * var(--s)) 0; }
    .wip-toggle:hover { color: var(--text); }
    .chev { display: inline-block; transition: transform 0.25s cubic-bezier(.2,.8,.2,1); font-size: calc(15px * var(--s)); line-height: 1; }
    .wip-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .wip-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s cubic-bezier(.2,.8,.2,1); }
    .wip-drawer.open { grid-template-rows: 1fr; }
    /* sur PC : la liste se déroule par-dessus (hors du flux), donc le profil ne bouge pas */
    @media (min-width: 821px) {
      .wip-drawer { position: absolute; left: calc(-0.6rem * var(--s)); top: 100%; z-index: 5; min-width: calc(100% + 1.2rem * var(--s));
        width: max-content; max-width: calc(460px * var(--s)); padding: 0 calc(0.6rem * var(--s)); border-radius: calc(10px * var(--s));
        background: var(--bg); box-shadow: 0 calc(12px * var(--s)) calc(30px * var(--s)) rgba(20,22,26,0); transition: grid-template-rows 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s, padding 0.35s; }
      .wip-drawer.open { box-shadow: 0 calc(12px * var(--s)) calc(30px * var(--s)) rgba(20,22,26,0.08); padding-bottom: calc(0.5rem * var(--s)); }
      .wip-list { min-width: calc(300px * var(--s)); }
    }
    .wip-list { overflow: hidden; list-style: none; }
    .wip-list li { opacity: 0; transform: translateY(-4px); transition: opacity 0.25s, transform 0.25s; }
    .wip-drawer.open .wip-list li { opacity: 1; transform: none; }
    .wip-drawer.open .wip-list li:nth-child(2) { transition-delay: 0.05s; }
    .wip-drawer.open .wip-list li:nth-child(3) { transition-delay: 0.1s; }
    .wip-drawer.open .wip-list li:nth-child(4) { transition-delay: 0.15s; }
    .game { display: flex; align-items: center; gap: calc(0.8rem * var(--s)); padding: calc(0.45rem * var(--s)) calc(0.5rem * var(--s)); margin: 0 calc(-0.5rem * var(--s)); border-radius: calc(6px * var(--s)); background-color: transparent; transition: background-color 0.35s ease; }
    .wip-list li:first-child .game { margin-top: calc(0.6rem * var(--s)); }
    .wip-list li:hover a.game { background-color: var(--surface); transition-duration: 0.2s; }
    .game img, .game .noicon { width: calc(38px * var(--s)); height: calc(38px * var(--s)); border-radius: calc(8px * var(--s)); flex: none; background: var(--surface); object-fit: cover; }
    .game b { font-weight: 600; display: block; }
    .game small { color: var(--dim); font-size: calc(12px * var(--s)); }
    .game small .label { color: var(--faint); }
    .game .playing { color: var(--online); }
    .wip-list li { position: relative; }
    .game-dc { position: absolute; right: calc(0.4rem * var(--s)); top: 50%; display: flex; align-items: center; justify-content: center;
      width: calc(32px * var(--s)); height: calc(32px * var(--s)); border-radius: calc(8px * var(--s)); color: var(--dim);
      opacity: 0; transform: translate(6px, -50%); transition: opacity 0.2s, transform 0.25s cubic-bezier(.2,.8,.2,1), color 0.15s, background 0.15s; }
    .game-dc svg { width: calc(18px * var(--s)); height: calc(18px * var(--s)); }
    .wip-list li:hover .game-dc, .game-dc:focus-visible { opacity: 1; transform: translate(0, -50%); }
    .game-dc:hover { color: #fff; background: #5865f2; }
    @media (hover: none) { .game-dc { opacity: 1; transform: translate(0, -50%); } }

    /* ── WORK ── */
    .work { margin-top: calc(4rem * var(--s)); }
    .work-soon { display: flex; align-items: center; gap: calc(1.2rem * var(--s)); color: var(--faint); }
    .work-soon::before, .work-soon::after { content: ''; flex: 1; height: calc(1px * var(--s)); background: var(--surface); }
    .work-soon[hidden] { display: none; }
    .work-head { display: flex; align-items: center; gap: calc(1.2rem * var(--s)); margin-bottom: calc(0.4rem * var(--s)); }
    .work-head::after { content: ''; flex: 1; height: 1px; background: var(--surface); }
    .work-title { font-weight: 600; }
    .showreel { aspect-ratio: 16 / 9; border-radius: calc(8px * var(--s)); overflow: hidden; background: #000; margin: calc(0.8rem * var(--s)) 0; }
    .showreel iframe { display: block; width: 100%; height: 100%; border: 0; }
    .showreel[hidden] { display: none; }

    /* liste de travaux : une ligne par clip, aperçu flottant au survol */
    .work-list { list-style: none; }
    .work-row { display: flex; align-items: center; gap: calc(1rem * var(--s)); width: 100%; text-align: left;
      padding: calc(0.75rem * var(--s)) 0; border-bottom: 1px solid var(--surface); color: var(--text); }
    .work-row .w-title { flex: 1; transition: transform 0.35s cubic-bezier(.2,.8,.2,1), color 0.25s; }
    .work-row .w-meta { color: var(--faint); font-size: calc(12px * var(--s)); transition: color 0.25s; white-space: nowrap; }
    .work-row .w-arrow { color: var(--faint); width: 1em; opacity: 0; transform: translateX(-6px); transition: opacity 0.25s, transform 0.35s cubic-bezier(.2,.8,.2,1); }
    .work-list:hover .work-row .w-title { color: var(--faint); }
    .work-list .work-row:hover .w-title { color: var(--text); transform: translateX(calc(8px * var(--s))); }
    .work-row:hover .w-meta { color: var(--dim); }
    .work-row:hover .w-arrow { opacity: 1; transform: none; }
    .w-thumb { display: none; }

    .peek { position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none; width: min(calc(420px * var(--s)), 42vw); aspect-ratio: 16 / 9;
      border-radius: calc(10px * var(--s)); overflow: hidden; background: var(--surface);
      box-shadow: 0 calc(18px * var(--s)) calc(40px * var(--s)) rgba(20,22,26,0.18);
      opacity: 0; transition: opacity 0.25s ease; will-change: transform; }
    .peek.on { opacity: 1; }
    .peek-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease; }
    .peek-layer.on { opacity: 1; }
    .peek video, .peek canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .peek .clip-demo { position: absolute; left: calc(0.45rem * var(--s)); top: calc(0.45rem * var(--s)); }

    /* tactile : pas de survol, on montre une mini vignette dans la ligne */
    @media (hover: none) {
      .w-thumb { display: block; position: relative; flex: none; width: calc(92px * var(--s)); aspect-ratio: 16 / 9; border-radius: calc(6px * var(--s)); overflow: hidden; background: var(--surface); }
      .w-thumb video, .w-thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .work-row .w-meta { display: block; }
      .w-text { flex: 1; display: flex; flex-direction: column; }
      .work-row .w-arrow { display: none; }
    }
    .clip-demo { font-size: calc(10px * var(--s)); color: var(--faint); background: rgba(255,255,255,0.85); padding: 0 calc(0.35rem * var(--s)); border-radius: calc(4px * var(--s)); }

    /* ── BOUTONS 88x31 ── */
    .bottom { margin-top: calc(4rem * var(--s)); }
    .badges { display: flex; flex-wrap: wrap; gap: calc(6px * var(--s)); }
    .badges img { display: block; width: calc(88px * var(--s)); height: calc(31px * var(--s)); image-rendering: pixelated; }


    /* ── PLAYER ── */
    .player { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: calc(1rem * var(--s)); background: rgba(20,22,26,0.85); }
    .player.open { display: flex; }
    .player-frame { width: min(calc(960px * var(--s)), 100%, calc((100vh - calc(4rem * var(--s))) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border-radius: calc(4px * var(--s)); overflow: hidden; }
    .player-frame iframe, .player-frame video, .player-frame canvas { display: block; width: 100%; height: 100%; border: 0; }
    .player { opacity: 0; transition: opacity 0.25s; }
    .player.show { opacity: 1; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes ring { to { --angle: 360deg; } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70%, 100% { box-shadow: 0 0 0 calc(6px * var(--s)) transparent; } }
    @keyframes hop {   /* chaque lettre saute avec anticipation et squash, comme le perso */
      0%   { transform: none; }
      18%  { transform: scale(1.1, 0.88); }
      46%  { transform: translateY(-6px) scale(0.95, 1.07); }
      70%  { transform: translateY(0) scale(1.07, 0.93); }
      85%  { transform: scale(0.98, 1.02); }
      100% { transform: none; }
    }

    @media (max-width: 820px) {
      :root { --s: 1; }
      main { padding-top: calc(0.5rem * var(--s)); justify-content: flex-start; }
      .top { grid-template-columns: 1fr; gap: calc(0.5rem * var(--s)); }
      .stage { height: calc(290px * var(--s)); }
      .presence, .wip { margin-left: 0; }
    }
    @media (max-width: 480px) {
      .pfp-wrap { width: calc(84px * var(--s)); height: calc(84px * var(--s)); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>

<main>
  <section class="top">
    <div class="stage" id="avatar-stage" aria-label="My Roblox avatar, click to spin">
      <div class="stage-msg" id="avatar-loading">loading…</div>
    </div>

    <div>
      <div class="profile">
        <div class="pfp-wrap" id="pfp-wrap"><img class="pfp" id="pfp" alt="" /></div>
        <div>
          <h1 class="hi">hi, i'm <span class="name" aria-label="JGG"><span>J</span><span>G</span><span>G</span></span></h1>
          <p class="sub" id="sub">roblox animator &amp; a bit of everything else.</p>
          <div class="socials" id="socials"></div>

      <div class="presence">
        <div class="row" id="row-discord" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.5 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.7 19.7 0 0 0 6 3l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4-2 1 1.3 2.1a19.6 19.6 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
          <span class="st" id="st"></span><span class="act" id="act"></span>
        </div>
        <div class="row" id="row-spotify" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.3a.7.7 0 0 1-1 .3c-2.8-1.7-6.4-2.1-10.6-1.2a.7.7 0 1 1-.3-1.4c4.6-1 8.5-.6 11.6 1.3.4.2.5.7.3 1Zm1.5-3.3a.9.9 0 0 1-1.3.3c-3.2-2-8.1-2.6-11.9-1.4a.9.9 0 1 1-.5-1.7c4.3-1.3 9.7-.7 13.4 1.6.4.3.5.8.3 1.2Zm.1-3.4C15.3 8.3 8.9 8.1 5.2 9.2a1.1 1.1 0 1 1-.6-2.1c4.2-1.3 11.3-1 15.7 1.6a1.1 1.1 0 0 1-1.2 1.9Z"/></svg>
          <span id="spotify">not listening to anything</span>
        </div>
      </div>

      <div class="wip" id="wip" hidden>
        <button class="wip-toggle" id="wip-toggle" aria-expanded="false" aria-controls="wip-list">
          <span class="chev">›</span> what i'm working on

        <div class="wip-drawer" id="wip-drawer">
          <ul class="wip-list" id="wip-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <section class="work" aria-label="Work">
    <div class="work-head" id="work-head"><span class="work-title">my work</span></div>
    <div class="showreel" id="showreel" hidden></div>

  <section class="bottom" id="bottom" hidden>
    <div class="badges" id="badges"></div>
  </section>
</main>


<div class="peek" id="peek" aria-hidden="true"></div>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video">

</div>

<script>
/* ═══════════ CONFIG — tout se règle ici ═══════════ */
const CONFIG = {
  robloxUserId: 1077832330,
  discordTag: '.JGG',
  // ID Discord pour le statut live (+ rejoindre https://discord.gg/lanyard). Vide = ligne cachée.
  discordId: '852210182196035597',
  // Autres liens (optionnels) : mets l'URL ou laisse vide.
  youtube: '',
  x: 'https://x.com/JGG5694',
};

/* WHAT I'M WORKING ON — tes jeux Roblox. url = lien roblox.com/games/... (icône + joueurs en ligne auto).
   Laisse url vide si le jeu n'est pas encore public. Liste vide = bouton caché. */
const GAMES = [
  { name: "aftershift", role: "basically everything", url: "https://www.roblox.com/games/97049467136477/AFTERSHIFT", universeId: 10696463443, discord: "https://discord.gg/Y5gAFdphZ" },
  { name: "elder gate", role: "main animator", url: "https://www.roblox.com/games/104403529162136/Elder-Gate" },
  // icon: "icons/jeu.png"  -> optionnel, remplace l'icône auto
  // discord: "https://discord.gg/..."  -> optionnel, bouton Discord au survol
];

/* MY WORK
   clip : petit .mp4 muet de 3-8 s qui tourne en boucle dans la grille (mets-le dans un dossier work/ du repo)
   full : optionnel, version longue/avec son ouverte au clic (.mp4, YouTube ou Streamable). Sinon le clip s'ouvre en grand.
   type : animation / vfx / scripting / modeling… (sert aux filtres)
   where : optionnel, jeu ou client
   ⚠️ TEMPLATES : les lignes avec demo: true sont des exemples animés, supprime-les quand tu mets tes vrais clips. */
const SHOWREEL = '';   // optionnel : lien YouTube de ton showreel, s'affiche en grand en haut de la section
const PROJECTS = [
{ title: "miner comission", type: "animation", where: "World Invasion", clip: "PortofolioVideos/World-Invasion-Miner.mp4" },
  { title: "fireball",          type: "vfx",       where: "commission", demo: true },
  { title: "victory emote",     type: "animation", where: "elder gate", demo: true },

// Temps réel : WebSocket Lanyard (mise à jour instantanée), avec reconnexion auto.
// Si le socket ne marche pas, on retombe sur un rafraîchissement toutes les 15 s.
let pollTimer = null;
async function pollPresence() {
  try {
    const j = await (await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordId}`)).json();
    if (j.success) renderPresence(j.data); else robloxPfp();
  } catch (_) { robloxPfp(); }
}
function startPolling() { if (!pollTimer) { pollPresence(); pollTimer = setInterval(pollPresence, 15000); } }
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

function connectLanyard(retry = 0) {
  let ws, heartbeat;
  try { ws = new WebSocket('wss://api.lanyard.rest/socket'); } catch (_) { startPolling(); return; }
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.op === 1) { // hello
      heartbeat = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
      ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: CONFIG.discordId } }));
    } else if (msg.op === 0 && (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE')) {
      stopPolling(); retry = 0;
      renderPresence(msg.d);
    }
  };
  ws.onclose = () => {
    clearInterval(heartbeat);
    startPolling();                                         // pendant la coupure, on continue en polling
    setTimeout(() => connectLanyard(retry + 1), Math.min(30000, 2000 * 2 ** retry));
  };
  ws.onerror = () => ws.close();
}

/* Template animé (demo: true) : l'exercice de base de l'animateur, la balle qui rebondit, avec squash & stretch */
const DEMO_COLORS = ['#2f6fed', '#e8590c', '#2f9e44', '#c2255c', '#7048e8', '#0c8599'];
function demoCanvas(seed) {
  const cv = el('canvas'); const ctx = cv.getContext('2d');
  const col = DEMO_COLORS[seed % DEMO_COLORS.length], period = 1.1 + (seed % 3) * 0.18, phase = seed * 0.37;
  let running = false, raf = 0;
  function draw(t) {
    const W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
    if (!W) return;
    ctx.fillStyle = '#eceef1'; ctx.fillRect(0, 0, W, H);
    const ground = H * 0.82, r = H * 0.09;
    ctx.fillStyle = '#dfe2e7'; ctx.fillRect(0, ground, W, H - ground);
    const u = ((t / 1000 + phase) / period) % 1;                   // 0..1 sur un rebond
    const x = W * (0.12 + 0.76 * (((t / 1000 + phase) / (period * 4)) % 1));
    const h = 4 * u * (1 - u);                                      // arc
    let sy = 1 + 0.25 * Math.abs(1 - 2 * u) * (h < 0.25 ? 1 : 0.4);  // étiré en vitesse
    const contact = Math.min(u, 1 - u);
    if (contact < 0.06) sy = 0.62 + contact / 0.06 * 0.38;           // squash au contact
    const sx = 1 / Math.sqrt(sy);
    const y = ground - r * sy - h * (H * 0.55);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.18 * (1 - h * 0.8)) + ')';
    ctx.beginPath(); ctx.ellipse(x, ground + 2, r * (1.1 - h * 0.5), r * 0.22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, r * sx, r * sy, 0, 0, 7); ctx.fill();
  }
  function loop(t) { draw(t); if (running) raf = requestAnimationFrame(loop); }
  cv.play = () => { if (!running) { running = true; raf = requestAnimationFrame(loop); } };
  cv.pause = () => { running = false; cancelAnimationFrame(raf); };
  requestAnimationFrame(t => draw(reduceMo ? 300 : t));
  return cv;
}

/* aperçu flottant qui suit le curseur avec un léger retard (ressort) */
let peekIdx = -1, peekOn = false, px = 0, py = 0, tx = 0, ty = 0, pvx = 0, pvy = 0, prot = 0, pRaf = 0, pLast = 0;
addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, { passive: true });
// Chaque clip a son calque dans la boîte : en passant d'une ligne à l'autre, la boîte reste
// et les clips se fondent l'un dans l'autre (crossfade) au lieu de se réinitialiser.
const peekLayers = [];
function layerFor(idx) {
  if (peekLayers[idx] !== undefined) return peekLayers[idx];
  const m = peekMedia[idx];
  if (!m) return (peekLayers[idx] = null);
  const l = el('div', 'peek-layer'); l.append(m);
  if (PROJECTS[idx].demo) l.append(el('span', 'clip-demo', 'template'));
  peek.append(l);
  return (peekLayers[idx] = l);
}
let hideTimer = 0;
function showPeek(idx) {
  clearTimeout(hideTimer);
  const l = layerFor(idx);
  if (!l) return;
  if (peekIdx !== idx) {
    peekLayers.forEach((x, i) => { if (x && i !== idx) x.classList.remove('on'); });
    l.classList.add('on');
    const m = peekMedia[idx];
    if (!reduceMo) { const r = m.play(); if (r && r.catch) r.catch(() => {}); }
    const prev = peekIdx; peekIdx = idx;
    if (prev >= 0 && peekMedia[prev]) setTimeout(() => { if (peekIdx !== prev) peekMedia[prev].pause(); }, 320);
  }
  if (!peekOn && !peek.classList.contains('on')) { px = tx; py = ty; pvx = pvy = 0; }
  peekOn = true; peek.classList.add('on');
  if (!pRaf) { pLast = performance.now(); pRaf = requestAnimationFrame(peekLoop); }
}
function hidePeek() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    peekOn = false; peek.classList.remove('on');
    setTimeout(() => { if (!peekOn && peekMedia[peekIdx]) peekMedia[peekIdx].pause(); }, 260);
  }, 60);
}
work.addEventListener('mouseleave', hidePeek);
function peekLoop(now) {
  const dt = Math.min((now - pLast) / 1000, 0.05); pLast = now;
  const k = 90, c = 2 * Math.sqrt(k) * 0.8;                 // ressort un peu "souple" : léger retard + petit overshoot
  pvx += ((tx - px) * k - pvx * c) * dt; pvy += ((ty - py) * k - pvy * c) * dt;
  px += pvx * dt; py += pvy * dt;
  const w = peek.offsetWidth, h = peek.offsetHeight, gap = 24;
  let x = px + gap, y = py - h / 2;
  if (x + w > innerWidth - 12) x = px - w - gap;             // passe à gauche du curseur près du bord
  y = Math.max(12, Math.min(innerHeight - h - 12, y));
  prot += (Math.max(-6, Math.min(6, pvx * 0.012)) - prot) * 0.2;   // s'incline selon la vitesse
  peek.style.transform = `translate(${x}px, ${y}px) rotate(${reduceMo ? 0 : prot}deg) scale(${peekOn ? 1 : 0.92})`;
  if (peekOn || Math.abs(pvx) + Math.abs(pvy) > 1) pRaf = requestAnimationFrame(peekLoop); else pRaf = 0;
}

/* Icônes des jeux : 1 seule requête groupée par placeId (l'ancienne méthode passait par une API souvent bloquée = icônes qui ratent).
   Cache local + 3 essais si Roblox ne répond pas. */
function placeIdOf(g) { return ((g.url || '').match(/games\/(\d+)/) || [])[1]; }
function setGameIcon(g, url) {
  if (!url || g.icon || g._icon.tagName === 'IMG') return;
  const img = el('img'); img.alt = '';
  img.onerror = () => { try { localStorage.removeItem('icon:' + placeIdOf(g)); } catch (_) {} };
  img.src = url; g._icon.replaceWith(img); g._icon = img;
}
async function loadGameIcons(attempt = 0) {
  const todo = GAMES.filter(g => !g.icon && placeIdOf(g));
  todo.forEach(g => { try { setGameIcon(g, localStorage.getItem('icon:' + placeIdOf(g))); } catch (_) {} });
  if (!todo.length) return;
  try {
    const ids = todo.map(placeIdOf).join(',');
    const r = await fetch(`https://thumbnails.roproxy.com/v1/places/gameicons?placeIds=${ids}&returnPolicy=PlaceHolder&size=150x150&format=Png&isCircular=false`);
    if (!r.ok) throw 0;
    const { data = [] } = await r.json();
    let pending = false;
    data.forEach(d => {
      const g = todo.find(x => placeIdOf(x) === String(d.targetId));
      if (!g) return;
      if (d.state === 'Completed' && d.imageUrl) {
        try { localStorage.setItem('icon:' + d.targetId, d.imageUrl); } catch (_) {}
        if (g._icon.tagName === 'IMG') { if (g._icon.src !== d.imageUrl) g._icon.src = d.imageUrl; }
        else setGameIcon(g, d.imageUrl);
      } else pending = true;
    });
    if (pending && attempt < 3) setTimeout(() => loadGameIcons(attempt + 1), 2000);
  } catch (_) { if (attempt < 3) setTimeout(() => loadGameIcons(attempt + 1), 1500 * (attempt + 1)); }
}

/* Joueurs en ligne (bonus) : universeId mis en cache, aucun impact sur les icônes si ça échoue */
async function loadPlayerCounts() {
  for (const g of GAMES) {
    const pid = placeIdOf(g); if (!pid) continue;
    try {
      let uid = g.universeId; try { uid = uid || localStorage.getItem('uni:' + pid); } catch (_) {}
      if (!uid) {

        if (!r.ok) continue;
        uid = (await r.json()).universeId; if (!uid) continue;

const tilt = { on: false, base: null, x: 0, y: 0 };
function onTilt(e) {

  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (ang === 90) { [b, g] = [-g, b]; } else if (ang === -90 || ang === 270) { [b, g] = [g, -b]; }
  if (!tilt.base) tilt.base = { b, g };
  tilt.base.b += (b - tilt.base.b) * 0.004;                 // recalage très lent du neutre
  tilt.base.g += (g - tilt.base.g) * 0.004;
  const tx = Math.max(-1, Math.min(1, -(g - tilt.base.g) / 25));   // penche à droite -> il te regarde (vers la gauche de l'écran)
  const ty = Math.max(-1, Math.min(1, (b - tilt.base.b) / 22));    // haut du tel vers l'arrière -> il regarde vers le bas
  tilt.x += (tx - tilt.x) * 0.25; tilt.y += (ty - tilt.y) * 0.25;  // anti-tremblement
  pointer.x = tilt.x; pointer.y = tilt.y; pointer.last = performance.now();
  tilt.on = true;
}
if (matchMedia('(hover: none)').matches && 'DeviceOrientationEvent' in window) {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iPhone : il faut une autorisation, demandée au premier toucher sur la page
    const ask = () => DeviceOrientationEvent.requestPermission()
      .then(r => { if (r === 'granted') addEventListener('deviceorientation', onTilt); }).catch(() => {});
    addEventListener('touchend', ask, { once: true });
  } else {
    addEventListener('deviceorientation', onTilt);
  }
}

async function init3D() {
  const res = await fetch('avatar/avatar.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('no avatar.json');
  const meta = await res.json();
  const THREE = await import('three');
  const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
  const { MTLLoader } = await import('three/addons/loaders/MTLLoader.js');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(matchMedia('(hover: none)').matches ? Math.min(devicePixelRatio, 3) : 3);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.1;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9ca3, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(3, 6, 5); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xdfe6ff, 0.6); fill.position.set(-5, 2, 4); scene.add(fill);

  const v = meta.signature || '';
  const mtl = new MTLLoader();
  mtl.setResourcePath('avatar/');
  mtl.setMaterialOptions({ side: THREE.DoubleSide });
  const materials = await mtl.loadAsync(`avatar/${meta.mtl}?v=${v}`);
  materials.preload();
  // Roblox : couleur finale = mix(couleur du corps, texture, alpha de la texture).
  // three.js multiplie les deux par défaut, ce qui teintait tout en orange et cachait le t-shirt.
  for (const k in materials.materials) {
    const m = materials.materials[k];
    m.transparent = false; m.alphaMap = null; m.alphaTest = 0; m.opacity = 1; m.shininess = 4;
    if (m.specular) m.specular.setHex(0x0a0a0a);
    if (m.map) {
      m.map.colorSpace = THREE.SRGBColorSpace;
      m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const body = m.color.clone();
      m.color.set(0xffffff);
      m.onBeforeCompile = sh => {
        sh.uniforms.bodyColor = { value: body };
        sh.fragmentShader = 'uniform vec3 bodyColor;\n' + sh.fragmentShader.replace('#include <map_fragment>',
          '#ifdef USE_MAP\n vec4 texel = texture2D( map, vMapUv );\n diffuseColor.rgb = mix( bodyColor, texel.rgb, texel.a );\n#endif');
      };
      m.customProgramCacheKey = () => 'roblox-mix';
    }
    m.needsUpdate = true;
  }
  const loader = new OBJLoader(); loader.setMaterials(materials);
  const obj = await loader.loadAsync(`avatar/${meta.obj}?v=${v}`);

  // pieds à y=0 pour que le squash & stretch se fasse depuis le sol
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  obj.position.set(-center.x, -box.min.y, -center.z);
  const H = 4;
  const scaler = new THREE.Group(); scaler.add(obj); scaler.scale.setScalar(H / size.y);
  const facing = new THREE.Group(); facing.add(scaler);
  if (meta.camera?.position) facing.rotation.y = -Math.atan2(meta.camera.position.x - center.x, meta.camera.position.z - center.z);
  facing.rotation.y += meta.yawOffset || 0;
  const pivot = new THREE.Group(); pivot.add(facing);
  const root = new THREE.Group(); root.add(pivot); scene.add(root);

  // Tête séparée du corps : la tête suit la souris, le corps suit un peu.
  // Tête = la pièce "Player" la plus haute ; accessoires (Handle) au-dessus du cou = attachés à la tête.
  const fwd = meta.camera?.position ? Math.atan2(meta.camera.position.x - center.x, meta.camera.position.z - center.z) : 0;
  const headAxisX = new THREE.Vector3(Math.cos(fwd), 0, -Math.sin(fwd));   // axe "oui" de la tête dans le repère de l'OBJ
  const AXIS_Y = new THREE.Vector3(0, 1, 0);
  let head = null;
  {
    const parts = obj.children.filter(c => c.isMesh).map(c => ({ c, b: new THREE.Box3().setFromObject(c) }));
    const players = parts.filter(p => /^player/i.test(p.c.name));
    if (players.length > 1) {
      const top = players.reduce((a, b) => (b.b.getCenter(new THREE.Vector3()).y > a.b.getCenter(new THREE.Vector3()).y ? b : a));
      const neckY = top.b.min.y;
      const hc = top.b.getCenter(new THREE.Vector3());
      head = new THREE.Group();
      head.position.set(hc.x, neckY, hc.z);
      obj.add(head);
      parts.forEach(p => {
        const isHead = p === top || (!/^player/i.test(p.c.name) && p.b.getCenter(new THREE.Vector3()).y > neckY);
        if (!isHead) return;
        p.c.position.sub(head.position);
        head.add(p.c);
      });
    }
  }
  const qY = new THREE.Quaternion(), qX = new THREE.Quaternion();

  // Le canvas déborde du cadre (110px en haut/bas, 40px sur les côtés) pour que le saut,
  // la couronne et l'ombre ne soient jamais coupés ; le perso garde la taille du cadre.
  function fit() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const half = H * 0.5 * 1.2;
    const fitH = Math.max(half, half * 0.62 / (sw / sh));
    const dist = fitH * (h / sh) / Math.tan(THREE.MathUtils.degToRad(13));
    camera.position.set(0, H / 2 + 1.6, dist); camera.lookAt(0, H / 2 + 0.05, 0);
    camera.updateProjectionMatrix();
  }
  // ombre au sol dans la scène 3D, sous les pieds ; rétrécit quand il saute
  const shC = document.createElement('canvas'); shC.width = shC.height = 128;
  const shx = shC.getContext('2d'), grd = shx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.32)'); grd.addColorStop(0.6, 'rgba(0,0,0,0.12)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  shx.fillStyle = grd; shx.fillRect(0, 0, 128, 128);
  const shadowMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shC), transparent: true, depthWrite: false, toneMapped: false });
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), shadowMat);
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.005; shadow.renderOrder = -1;
  scene.add(shadow);
  stage.append(renderer.domElement); loading.remove(); fit();
  new ResizeObserver(fit).observe(stage);

  // Entrée : le perso tombe et atterrit (squash & stretch). Clic : anticipation, saut, vrille.
  let drop = reduce ? null : { t0: performance.now() + 150 };
  let hop = null, landAt = -1;
  if (drop) stage.classList.add('falling'); else stage.classList.add('landed');
  stage.addEventListener('click', () => { if (!hop && !drop && (landAt < 0 || performance.now() - landAt > 450)) hop = { t0: performance.now() }; });
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const smooth = t => t * t * (3 - 2 * t);
  const lerp = (a, b, t) => a + (b - a) * t;
  const inOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  let vis = true; new IntersectionObserver(([e]) => vis = e.isIntersecting).observe(stage);
  const touch = matchMedia('(hover: none)').matches;
  // Pose de repos : tourné vers SA gauche et regard un peu vers le bas
  const REST_YAW = 0.45, REST_PITCH = 0.14;
  let look = REST_YAW, lookP = REST_PITCH, body = REST_YAW * 0.6, last = performance.now();
  // ressorts amortis (pas de saut de vitesse = pas de snap)
  let vLook = 0, vLookP = 0, vBody = 0, idleW = 1;
  const spring = (x, v, target, k, dt) => { const c = 2 * Math.sqrt(k); v += ((target - x) * k - v * c) * dt; return [x + v * dt, v]; };
  (function frame(now) {
    requestAnimationFrame(frame);
    if (!vis || document.hidden) { last = now; return; }
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    // passage progressif souris <-> pose de repos (au lieu d'un switch brutal)
    const idleTarget = ((touch && !tilt.on) || now - pointer.last > 4000) ? 1 : 0;
    idleW += (idleTarget - idleW) * (1 - Math.exp(-dt * (idleTarget ? 1.2 : 6)));
    // où la tête regarde (yaw/pitch "monde") : la souris, ou la pose de repos avec un léger balancement
    const restYaw = REST_YAW + (reduce ? 0 : Math.sin(now / 2200) * 0.12);
    const tLook = pointer.x * 0.95 * (1 - idleW) + restYaw * idleW;
    const tLookP = (0.04 + pointer.y * 0.35) * (1 - idleW) + REST_PITCH * idleW;
    [look, vLook] = spring(look, vLook, tLook, 45, dt);            // tête : réactive
    [lookP, vLookP] = spring(lookP, vLookP, tLookP, 45, dt);
    const tBody = head ? REST_YAW * 0.6 + (look - REST_YAW * 0.6) * 0.3 : look;
    [body, vBody] = spring(body, vBody, tBody, 10, dt);            // corps : suit plus lentement

    // Toutes les courbes sont continues : chaque phase démarre exactement là où la précédente s'arrête.
    let y = 0, sy = 1, spin = 0;
    if (drop) {
      const p = Math.max(0, Math.min((now - drop.t0) / 550, 1));
      y = 8 * (1 - p * p);
      sy = 1 + 0.12 * 4 * p * (1 - p);                       // stretch en chute, revient à 1 pile à l'impact
      if (p >= 1) { drop = null; landAt = now; stage.classList.replace('falling', 'landed'); }
    } else if (hop) {
      const e = (now - hop.t0) / 1000;
      const ANTI = 0.16, AIR = 0.6;
      if (e < ANTI) {
        sy = 1 - 0.16 * ease((e / ANTI));                     // anticipation : il s'accroupit
      } else {
        const p = Math.min((e - ANTI) / AIR, 1);
        y = 0.55 * 4 * p * (1 - p);
        spin = inOut(p) * Math.PI * 2;
        const airSy = 1 + 0.12 * (1 - p) * (1 - p);           // stretch au décollage, 1 pile à l'atterrissage
        sy = lerp(0.84, airSy, smooth(Math.min((e - ANTI) / 0.11, 1)));  // transition douce accroupi -> étiré
        if (p >= 1) { hop = null; landAt = now; }
      }
    }
    if (landAt >= 0) {
      const e = (now - landAt) / 1000;
      sy *= 1 - 0.27 * Math.exp(-6.5 * e) * Math.sin(15 * e); // squash à l'impact (part de 0 : pas de saut)
      if (e > 1.4) landAt = -1;
    }
    if (!reduce) sy *= 1 + 0.006 * Math.sin(now / 650);       // respiration, toujours active
    const sx = 1 / Math.sqrt(sy);                             // volume conservé

    root.position.y = y;
    root.scale.set(sx, sy, sx);
    const lift = Math.min(y / 3, 1);
    shadow.scale.setScalar(1 - lift * 0.55);
    shadowMat.opacity = 1 - lift * 0.85;
    if (head) {
      const hy = Math.tanh((look - body) / 1.1) * 1.1;          // limite douce, pas d'arrêt sec
      const hp = Math.tanh(lookP / 0.45) * 0.45;
      head.quaternion.copy(qY.setFromAxisAngle(AXIS_Y, hy)).multiply(qX.setFromAxisAngle(headAxisX, hp));
      pivot.rotation.set(0, body + spin, 0);
    } else {
      pivot.rotation.set(lookP * 0.6, body + spin, 0);
    }
    renderer.render(scene, camera);
  })(performance.now());
}

async function init2D() {
  const j = await (await fetch(`https://thumbnails.roproxy.com/v1/users/avatar?userIds=${CONFIG.robloxUserId}&size=720x720&format=Png&isCircular=false`)).json();
  const url = j.data?.[0]?.imageUrl; if (!url) throw 0;
  const img = new Image(); img.className = 'avatar-2d'; img.alt = 'My Roblox avatar'; img.src = url;
  await img.decode(); stage.append(img); loading.remove();
  stage.style.perspective = '900px';
  (function tilt() { requestAnimationFrame(tilt); img.style.transform = `rotateY(${pointer.x * 18}deg) rotateX(${-pointer.y * 8}deg)`; })();
}

init3D().catch(() => init2D().catch(() => loading.textContent = ''));
</script>
